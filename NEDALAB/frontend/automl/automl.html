<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>NEDA LAB — AutoML Studio</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/dark-mode.css">
<link rel="stylesheet" href="../shared/notifications.css">
<link rel="stylesheet" href="../shared/upload-widget.css">
<style>
.am-tab { padding:8px 16px; border-radius:6px; font-size:13px; font-weight:500;
  cursor:pointer; background:white; border:1px solid #e7e5e4; color:#57534e; }
.am-tab.active { background:#047857; color:white; border-color:#047857; }
body.dark .am-tab { background:#1c2028; border-color:#353a45; color:#d6d3d1; }
body.dark .am-tab.active { background:#10b981; color:#062017; border-color:#10b981; }
.leader-card { border: 1px solid #e7e5e4; border-radius: 8px; padding: 12px 16px;
  transition: all 0.15s; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.leader-card.winner { border-color: #047857; background: #ecfdf5; }
body.dark .leader-card { border-color: #262932; }
body.dark .leader-card.winner { background: rgba(16,185,129,0.12); border-color: #10b981; }
.key-box { background: #1c1917; color: #6ee7b7; font-family: 'IBM Plex Mono', monospace;
  padding: 12px; border-radius: 6px; font-size: 12px; word-break: break-all; }
.drift-badge { padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 500; }
.drift-healthy { background: #d1fae5; color: #065f46; }
.drift-warning { background: #fef3c7; color: #92400e; }
.drift-critical { background: #fee2e2; color: #991b1b; }
body.dark .drift-healthy { background: rgba(16,185,129,0.2); color: #6ee7b7; }
body.dark .drift-warning { background: rgba(251,191,36,0.2); color: #fcd34d; }
body.dark .drift-critical { background: rgba(239,68,68,0.2); color: #fca5a5; }
</style>
</head>
<body class="min-h-screen">
<div class="flex">
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <aside class="app-sidebar w-64 border-r flex flex-col min-h-screen" style="background:#f4f1ea;border-color:#e7e5e4">
    <div class="p-5">
      <a href="../dashboard/dashboard.html" class="brand-lockup no-underline"><span class="brand-mark">N</span><span class="brand-name"><span class="brand-word">NEDA</span><span class="brand-accent">Lab</span></span></a>
    </div>
    <nav id="sidebarNav" class="px-3 flex-1"></nav>
    <div class="p-5 border-t" style="border-color:#e7e5e4">
      <p id="sideUserName" class="text-sm font-medium text-stone-800">—</p>
      <p id="sideUserEmail" class="text-xs text-stone-500 truncate">—</p>
      <button id="logoutBtn" class="mt-3 text-xs font-medium text-red-700 hover:text-red-800">Sign out →</button>
    </div>
  </aside>

  <main class="app-main flex-1 p-8">
    <div class="max-w-6xl">
      <div class="flex items-center gap-3 mb-6">
        <button id="mobileMenuBtn" class="mobile-menu-btn">☰</button>
        <div>
          <h1 class="text-2xl font-bold text-stone-900">AutoML Studio</h1>
          <p class="text-sm text-stone-500">Auto-train models · Deploy as API · Monitor drift.</p>
        </div>
      </div>

      <div class="flex gap-2 mb-6 flex-wrap">
        <button class="am-tab active" data-tab="run">✨ AutoML Run</button>
        <button class="am-tab" data-tab="history">📚 Run History</button>
        <button class="am-tab" data-tab="api">🔑 Model API Keys</button>
        <button class="am-tab" data-tab="drift">📊 Drift Monitoring</button>
      </div>

      <div id="tabContent"></div>
      <div id="loading" style="display:none" class="card p-8 text-center">
        <span class="spinner"></span>
        <p class="text-sm text-stone-600 mt-2">Processing...</p>
      </div>
      <div id="result" class="mt-6"></div>
    </div>
  </main>
</div>

<script src="../shared/api.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/ui.js"></script>
<script src="automl.js"></script>
<script src="../shared/feature-registry.js"></script>
  <script src="../shared/dark-mode.js"></script>
<script src="../shared/notifications.js"></script>
<script src="../shared/upload-widget.js"></script>
</body>
</html>
