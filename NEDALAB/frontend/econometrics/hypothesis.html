<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>NEDA LAB — Hypothesis Testing</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/dark-mode.css">
<link rel="stylesheet" href="../shared/notifications.css">
<link rel="stylesheet" href="../shared/upload-widget.css">
<style>
.hyp-tab { padding:8px 14px; border-radius:6px; font-size:12px; font-weight:500;
  cursor:pointer; background:white; border:1px solid #e7e5e4; color:#57534e;
  transition: all 0.15s ease; }
.hyp-tab:hover { border-color: #047857; }
.hyp-tab.active { background:#047857; color:white; border-color:#047857; }
body.dark .hyp-tab { background:#1c2028; border-color:#353a45; color:#d6d3d1; }
body.dark .hyp-tab.active { background:#10b981; color:#062017; border-color:#10b981; }
.verdict {
  padding: 14px 18px; border-radius: 8px; font-size: 14px;
  display: flex; align-items: center; gap: 12px;
}
.verdict.reject { background: #ecfdf5; border-left: 4px solid #047857; color: #065f46; }
.verdict.fail { background: #fef3c7; border-left: 4px solid #b45309; color: #78350f; }
body.dark .verdict.reject { background: rgba(16,185,129,0.15); color: #6ee7b7; }
body.dark .verdict.fail { background: rgba(251,191,36,0.15); color: #fcd34d; }
</style>
</head>
<body class="min-h-screen">
<div class="flex">
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <aside class="app-sidebar w-64 border-r flex flex-col min-h-screen" style="background:#f4f1ea;border-color:#e7e5e4">
    <div class="p-5">
      <a href="../dashboard/dashboard.html" class="brand-lockup no-underline"><span class="brand-mark">N</span><span class="brand-name"><span class="brand-word">NEDA</span><span class="brand-accent">Lab</span></span></a>
    </div>
    <nav id="sidebarNav" class="px-3 flex-1"></nav>
    <div class="p-5 border-t" style="border-color:#e7e5e4">
      <p id="sideUserName" class="text-sm font-medium text-stone-800">—</p>
      <p id="sideUserEmail" class="text-xs text-stone-500 truncate">—</p>
      <button id="logoutBtn" class="mt-3 text-xs font-medium text-red-700 hover:text-red-800">Sign out →</button>
    </div>
  </aside>

  <main class="app-main flex-1 p-8">
    <div class="max-w-6xl">
      <div class="flex items-center gap-3 mb-6">
        <button id="mobileMenuBtn" class="mobile-menu-btn">☰</button>
        <div>
          <h1 class="text-2xl font-bold text-stone-900">Hypothesis Testing Suite</h1>
          <p class="text-sm text-stone-500">Statistical tests with automatic interpretation.</p>
        </div>
      </div>

      <div class="card p-5 mb-6">
        <label class="label">Dataset</label>
        <select id="dsSelect" class="input" style="max-width:400px">
          <option value="">Loading...</option>
        </select>
      </div>

      <div class="flex gap-2 mb-6 flex-wrap">
        <button class="hyp-tab active" data-test="ttest">📐 t-Test</button>
        <button class="hyp-tab" data-test="anova">📊 ANOVA</button>
        <button class="hyp-tab" data-test="chisquare">🔢 Chi-Square</button>
        <button class="hyp-tab" data-test="mannwhitney">📈 Mann-Whitney U</button>
        <button class="hyp-tab" data-test="kruskal">📉 Kruskal-Wallis</button>
        <button class="hyp-tab" data-test="shapiro">📏 Shapiro-Wilk</button>
        <button class="hyp-tab" data-test="levene">📐 Levene's</button>
        <!-- ✅ নতুন ২টি বাটন -->
        <button class="hyp-tab" data-test="correlation">🔗 Correlation</button>
        <button class="hyp-tab" data-test="tukey">📌 Tukey HSD</button>
      </div>

      <div id="tabContent"></div>

      <div id="loading" style="display:none" class="card p-8 text-center mt-6">
        <span class="spinner"></span>
        <p class="text-sm text-stone-600 mt-2">Running test...</p>
      </div>

      <div id="result" class="mt-6"></div>
    </div>
  </main>
</div>

<script src="../shared/api.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/ui.js"></script>
<script src="hypothesis.js"></script>
<script src="../shared/feature-registry.js"></script>
<script src="../shared/dark-mode.js"></script>
<script src="../shared/notifications.js"></script>
<script src="../shared/upload-widget.js"></script>
</body>
</html>
