<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>NEDA LAB — Advanced Econometrics</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/dark-mode.css">
<link rel="stylesheet" href="../shared/notifications.css">
<link rel="stylesheet" href="../shared/upload-widget.css">
<style>
.adv-tab { padding:8px 16px; border-radius:6px; font-size:13px; font-weight:500;
  cursor:pointer; background:white; border:1px solid #e7e5e4; color:#57534e; transition:all 0.15s; }
.adv-tab:hover { border-color:#047857; }
.adv-tab.active { background:#047857; color:white; border-color:#047857; }
body.dark .adv-tab { background:#1c2028; border-color:#353a45; color:#d6d3d1; }
body.dark .adv-tab.active { background:#10b981; color:#062017; border-color:#10b981; }
.role-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.role-table thead th { padding: 12px 10px; text-align: left; font-weight: 600;
  background: #f4f1ea; color: #57534e; border-bottom: 2px solid #e7e5e4;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
.role-table thead th.center { text-align: center; }
.role-table tbody td { padding: 8px 10px; border-bottom: 1px solid #f5f5f4; }
.role-table tbody td.center { text-align: center; }
.role-table tbody tr:hover { background: #fafaf9; }
.role-table tbody tr:hover td.center { background: #f0fdf4; }
.role-table .col-name { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #1c1917; }
.role-table input[type="radio"],
.role-table input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer;
  accent-color: #047857; }
.role-table input:disabled { opacity: 0.3; cursor: not-allowed; }
.search-input { width: 100%; max-width: 320px; padding: 8px 12px; border: 1px solid #d6d3d1;
  border-radius: 6px; font-size: 13px; background: white; }
.search-input:focus { outline: none; border-color: #047857; box-shadow: 0 0 0 3px rgba(4,120,87,0.1); }
body.dark .role-table thead th { background: #1c2028; color: #a8a29e; border-color: #262932; }
body.dark .role-table tbody td { border-color: #262932; color: #e7e5e4; }
body.dark .role-table tbody tr:hover { background: #1c2028; }
body.dark .role-table .col-name { color: #f5f5f4; }
body.dark .search-input { background: #1c2028; border-color: #353a45; color: #f5f5f4; }
.selected-summary { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px;
  background: #f0fdf4; border-radius: 8px; border: 1px solid #d1fae5; }
body.dark .selected-summary { background: rgba(16,185,129,0.08); border-color: rgba(16,185,129,0.3); }
.summary-item { font-size: 12px; padding: 4px 10px; background: white;
  border-radius: 6px; border: 1px solid #d1fae5; font-family: 'IBM Plex Mono', monospace; }
body.dark .summary-item { background: #0f172a; border-color: rgba(16,185,129,0.3); color: #6ee7b7; }
.summary-label { font-size: 11px; color: #047857; font-weight: 600; margin-right: 6px;
  text-transform: uppercase; letter-spacing: 0.05em; }
body.dark .summary-label { color: #6ee7b7; }
.role-hint { font-size: 11px; color: #78716c; margin-top: 2px; font-weight: 400; text-transform: none; letter-spacing: 0; }
</style>
</head>
<body class="min-h-screen">
<div class="flex">
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <aside class="app-sidebar w-64 border-r flex flex-col min-h-screen" style="background:#f4f1ea;border-color:#e7e5e4">
    <div class="p-5">
      <a href="../dashboard/dashboard.html" class="brand-lockup no-underline"><span class="brand-mark">N</span><span class="brand-name"><span class="brand-word">NEDA</span><span class="brand-accent">Lab</span></span></a>
    </div>
    <nav id="sidebarNav" class="px-3 flex-1"></nav>
    <div class="p-5 border-t" style="border-color:#e7e5e4">
      <p id="sideUserName" class="text-sm font-medium text-stone-800">—</p>
      <p id="sideUserEmail" class="text-xs text-stone-500 truncate">—</p>
      <button id="logoutBtn" class="mt-3 text-xs font-medium text-red-700 hover:text-red-800">Sign out →</button>
    </div>
  </aside>

  <main class="app-main flex-1 p-8">
    <div class="max-w-6xl">
      <div class="flex items-center gap-3 mb-6">
        <button id="mobileMenuBtn" class="mobile-menu-btn">☰</button>
        <div>
          <h1 class="text-2xl font-bold text-stone-900">Advanced Econometrics</h1>
          <p class="text-sm text-stone-500">Assign variable roles, then run IV · DiD · Johansen · VECM.</p>
        </div>
      </div>

      <div class="card p-5 mb-6">
        <div class="grid grid-cols-2 gap-4 items-end">
          <div>
            <label class="label">Dataset</label>
            <select id="dsSelect" class="input"><option value="">Loading...</option></select>
          </div>
          <div style="text-align:right">
            <p id="colCount" class="text-xs text-stone-500"></p>
          </div>
        </div>
      </div>

      <div class="flex gap-2 mb-6 flex-wrap">
        <button class="adv-tab active" data-tab="iv">⚙️ IV (2SLS)</button>
        <button class="adv-tab" data-tab="did">📊 Difference-in-Differences</button>
        <button class="adv-tab" data-tab="johansen">🔗 Johansen Cointegration</button>
        <button class="adv-tab" data-tab="vecm">🔄 VECM</button>
      </div>

      <div id="tabContent"></div>

      <div id="loading" style="display:none" class="card p-8 text-center mt-6">
        <span class="spinner"></span>
        <p class="text-sm text-stone-600 mt-2">Computing...</p>
      </div>

      <div id="result" class="mt-6"></div>
    </div>
  </main>
</div>

<script src="../shared/api.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/ui.js"></script>
<script src="advanced.js"></script>
<script src="../shared/feature-registry.js"></script>
  <script src="../shared/dark-mode.js"></script>
<script src="../shared/notifications.js"></script>
<script src="../shared/upload-widget.js"></script>
</body>
</html>
