<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>NEDA LAB — Statistical Tests</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/dark-mode.css">
<link rel="stylesheet" href="../shared/notifications.css">
<link rel="stylesheet" href="../shared/upload-widget.css">
<style>
.corr-cell {
  display:inline-block; padding:6px 8px; border-radius:4px; font-family:monospace;
  font-size:12px; min-width:64px; text-align:center;
}
.corr-grid {
  display:grid; gap:3px; font-size:12px;
}
.corr-grid .hdr {
  padding:6px 8px; font-weight:600; color:#57534e;
  font-size:11px; text-align:center; white-space:nowrap;
}
.tab-btn {
  padding:8px 16px; border-bottom:2px solid transparent; color:#78716c;
  font-size:13px; font-weight:500; cursor:pointer; background:none; border-top:none; border-left:none; border-right:none;
}
.tab-btn.active { border-bottom-color:#047857; color:#047857; }
</style>
  <link rel="stylesheet" href="../shared/export-widget.css">
</head>
<body class="min-h-screen">
<div class="flex">
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <aside class="app-sidebar w-64 border-r flex flex-col min-h-screen" style="background:#f4f1ea;border-color:#e7e5e4">
    <div class="p-5">
      <a href="../dashboard/dashboard.html" class="brand-lockup no-underline"><span class="brand-mark">N</span><span class="brand-name"><span class="brand-word">NEDA</span><span class="brand-accent">Lab</span></span></a>
    </div>
    <nav id="sidebarNav" class="px-3 flex-1"></nav>
    <div class="p-5 border-t" style="border-color:#e7e5e4">
      <p id="sideUserName" class="text-sm font-medium text-stone-800">—</p>
      <p id="sideUserEmail" class="text-xs text-stone-500 truncate">—</p>
      <button id="logoutBtn" class="mt-3 text-xs font-medium text-red-700 hover:text-red-800">Sign out →</button>
    </div>
  </aside>

  <main class="app-main flex-1 p-8">
    <div class="max-w-6xl">
      <div class="flex items-center gap-3 mb-6">
        <button id="mobileMenuBtn" class="mobile-menu-btn">☰</button>
        <div>
          <h1 class="text-2xl font-bold text-stone-900">Statistical Tests</h1>
          <p class="text-sm text-stone-500">Correlation, multicollinearity, causality, and descriptives.</p>
        </div>
      </div>

      <div class="card p-6 mb-6">
        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="label">Dataset</label>
            <select id="datasetSelect" class="input"><option value="">Loading...</option></select>
          </div>
          <div class="col-span-2">
            <label class="label">Columns (multi-select via checkboxes)</label>
            <div id="columnList" class="border rounded-md p-2 max-h-32 overflow-y-auto flex flex-wrap gap-3" style="border-color:#e7e5e4">
              <p class="text-xs text-stone-500">Select dataset first</p>
            </div>
          </div>
        </div>
      </div>

      <div class="border-b mb-6" style="border-color:#e7e5e4">
        <button data-tab="correlation" class="tab-btn active">Correlation</button>
        <button data-tab="vif" class="tab-btn">VIF (Multicollinearity)</button>
        <button data-tab="granger" class="tab-btn">Granger Causality</button>
        <button data-tab="descriptives" class="tab-btn">Descriptive Stats</button>
      </div>

      <div id="tabContent"></div>
    </div>
  </main>
</div>

<script src="../shared/api.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/ui.js"></script>
<script src="stats-tests.js"></script>
<script src="../shared/feature-registry.js"></script>
  <script src="../shared/dark-mode.js"></script>
<script src="../shared/notifications.js"></script>
<script src="../shared/upload-widget.js"></script>
  <script src="../shared/export-widget.js"></script>
</body>
</html>
