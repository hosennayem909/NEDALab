<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>NEDA LAB — Statistical Cleaning</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/dark-mode.css">
<link rel="stylesheet" href="../shared/notifications.css">
  <link rel="stylesheet" href="../shared/upload-widget.css">
  <link rel="stylesheet" href="../shared/export-widget.css">
</head>
<body class="min-h-screen">
<div class="flex">
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <aside class="app-sidebar w-64 border-r flex flex-col min-h-screen" style="background:#f4f1ea;border-color:#e7e5e4">
    <div class="p-5">
      <a href="../dashboard/dashboard.html" class="brand-lockup no-underline"><span class="brand-mark">N</span><span class="brand-name"><span class="brand-word">NEDA</span><span class="brand-accent">Lab</span></span></a>
    </div>
    <nav id="sidebarNav" class="px-3 flex-1"></nav>
    <div class="p-5 border-t" style="border-color:#e7e5e4">
      <p id="sideUserName" class="text-sm font-medium text-stone-800">—</p>
      <p id="sideUserEmail" class="text-xs text-stone-500 truncate">—</p>
      <button id="logoutBtn" class="mt-3 text-xs font-medium text-red-700 hover:text-red-800">Sign out →</button>
    </div>
  </aside>

  <main class="app-main flex-1 p-8">
    <div class="max-w-6xl">
      <div class="flex items-center gap-3 mb-6">
        <button id="mobileMenuBtn" class="mobile-menu-btn">☰</button>
        <div>
          <h1 class="text-2xl font-bold text-stone-900">Statistical Cleaning</h1>
          <p class="text-sm text-stone-500">Distribution analysis, outlier detection, normality tests.</p>
        </div>
      </div>

      <div class="card p-6 mb-6">
        <label class="label">Select dataset</label>
        <select id="datasetSelect" class="input" style="max-width:400px">
          <option value="">Loading...</option>
        </select>
      </div>

      <div id="loading" style="display:none" class="card p-8 text-center">
        <span class="spinner"></span>
        <p class="text-sm text-stone-600 mt-2">Analyzing data...</p>
      </div>

      <div id="content" style="display:none">
        <div id="summary" class="grid grid-cols-3 gap-4 mb-6"></div>
        <div id="columnCards" class="space-y-6"></div>
      </div>

      <div id="empty" class="card p-10 text-center">
        <p class="text-4xl mb-3">📐</p>
        <p class="font-medium text-stone-700">Select a dataset to analyze</p>
        <p class="text-sm text-stone-500 mt-1">Distribution stats, outliers, normality will appear here.</p>
      </div>
    </div>
  </main>
</div>

<script src="../shared/api.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/ui.js"></script>
<script src="stats.js"></script>
<script src="../shared/feature-registry.js"></script>
  <script src="../shared/dark-mode.js"></script>
<script src="../shared/notifications.js"></script>
  <script src="../shared/upload-widget.js"></script>
  <script src="../shared/export-widget.js"></script>
</body>
</html>
