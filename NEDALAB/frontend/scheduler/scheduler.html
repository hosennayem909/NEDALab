<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>NEDA LAB — Scheduler</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/dark-mode.css">
<link rel="stylesheet" href="../shared/notifications.css">
<link rel="stylesheet" href="../shared/upload-widget.css">
<style>
.task-card {
  border: 1px solid #e7e5e4; border-radius: 8px; padding: 16px;
  transition: all 0.15s;
}
.task-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.task-card.disabled { opacity: 0.6; }
.status-badge {
  display: inline-block; padding: 2px 10px; border-radius: 999px;
  font-size: 11px; font-weight: 500; font-family: 'IBM Plex Mono', monospace;
}
.status-success { background: #d1fae5; color: #065f46; }
.status-failed { background: #fee2e2; color: #991b1b; }
.status-running { background: #fef3c7; color: #92400e; }
body.dark .task-card { border-color: #262932; }
body.dark .task-card:hover { background: #1c2028; }
</style>
</head>
<body class="min-h-screen">
<div class="flex">
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <aside class="app-sidebar w-64 border-r flex flex-col min-h-screen" style="background:#f4f1ea;border-color:#e7e5e4">
    <div class="p-5">
      <a href="../dashboard/dashboard.html" class="brand-lockup no-underline"><span class="brand-mark">N</span><span class="brand-name"><span class="brand-word">NEDA</span><span class="brand-accent">Lab</span></span></a>
    </div>
    <nav id="sidebarNav" class="px-3 flex-1"></nav>
    <div class="p-5 border-t" style="border-color:#e7e5e4">
      <p id="sideUserName" class="text-sm font-medium text-stone-800">—</p>
      <p id="sideUserEmail" class="text-xs text-stone-500 truncate">—</p>
      <button id="logoutBtn" class="mt-3 text-xs font-medium text-red-700 hover:text-red-800">Sign out →</button>
    </div>
  </aside>

  <main class="app-main flex-1 p-8">
    <div class="max-w-6xl">
      <div class="flex justify-between items-center mb-6 flex-wrap gap-3">
        <div class="flex items-center gap-3">
          <button id="mobileMenuBtn" class="mobile-menu-btn">☰</button>
          <div>
            <h1 class="text-2xl font-bold text-stone-900">Scheduled Automation</h1>
            <p class="text-sm text-stone-500">Create recurring tasks that run automatically.</p>
          </div>
        </div>
        <button id="newTaskBtn" class="btn-primary">+ New Task</button>
      </div>

      <div id="newTaskForm" class="card p-6 mb-6" style="display:none">
        <div class="flex justify-between items-center mb-4">
          <h2 class="font-semibold text-stone-900">Create Task</h2>
          <button id="cancelNewBtn" class="text-xs text-stone-500 hover:text-stone-800">Cancel</button>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="label">Task name</label>
            <input id="taskName" class="input" placeholder="e.g. Weekly sales snapshot" />
          </div>
          <div>
            <label class="label">Task type</label>
            <select id="taskType" class="input">
              <option value="snapshot">Snapshot version</option>
              <option value="export_excel">Export Excel</option>
              <option value="export_pdf">Export PDF</option>
            </select>
          </div>
          <div>
            <label class="label">Dataset</label>
            <select id="taskDataset" class="input"><option value="">Loading...</option></select>
          </div>
          <div>
            <label class="label">Schedule</label>
            <select id="taskSchedule" class="input">
              <option value="hourly">Hourly (every hour at :00)</option>
              <option value="daily" selected>Daily (9:00 AM UTC)</option>
              <option value="weekly">Weekly (Monday 9:00 AM)</option>
              <option value="monthly">Monthly (1st, 9:00 AM)</option>
            </select>
          </div>
        </div>
        <button id="createTaskBtn" class="btn-primary mt-4">Create Task</button>
      </div>

      <div id="empty" class="card p-10 text-center">
        <p class="text-4xl mb-3">⏰</p>
        <p class="font-medium text-stone-700">No tasks yet</p>
        <p class="text-sm text-stone-500 mt-1">Create your first automated task to begin.</p>
      </div>

      <div id="taskList"></div>

      <div id="runsPanel" class="mt-6"></div>
    </div>
  </main>
</div>

<script src="../shared/api.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/ui.js"></script>
<script src="scheduler.js"></script>
<script src="../shared/feature-registry.js"></script>
  <script src="../shared/dark-mode.js"></script>
<script src="../shared/notifications.js"></script>
<script src="../shared/upload-widget.js"></script>
</body>
</html>
