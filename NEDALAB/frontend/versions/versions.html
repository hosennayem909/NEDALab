<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>NEDA LAB — Version History</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/dark-mode.css">
<link rel="stylesheet" href="../shared/notifications.css">
<link rel="stylesheet" href="../shared/upload-widget.css">
<style>
.version-row {
  border: 1px solid #e7e5e4; border-radius: 8px; padding: 12px 16px;
  transition: all 0.15s;
}
.version-row:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
.version-row.current { border-color: #047857; background: #ecfdf5; }
.v-badge {
  display: inline-block; padding: 2px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 500; font-family: 'IBM Plex Mono', monospace;
}
.v-badge-emerald { background: #d1fae5; color: #065f46; }
.v-badge-amber { background: #fef3c7; color: #92400e; }
.v-badge-red { background: #fee2e2; color: #991b1b; }
.v-badge-stone { background: #e7e5e4; color: #44403c; }
body.dark .version-row { border-color: #262932; }
body.dark .version-row:hover { background: #1c2028; }
body.dark .version-row.current { background: rgba(16,185,129,0.12); border-color: #10b981; }
.diff-grid { display: grid; grid-template-columns: 120px 1fr 1fr; gap: 6px; font-size: 12px; }
.diff-cell { padding: 6px 8px; border-radius: 4px; font-family: 'IBM Plex Mono', monospace; word-break: break-word; }
.diff-before { background: #fee2e2; color: #7f1d1d; }
.diff-after { background: #d1fae5; color: #065f46; }
body.dark .diff-before { background: rgba(239,68,68,0.15); color: #fca5a5; }
body.dark .diff-after { background: rgba(16,185,129,0.15); color: #6ee7b7; }
</style>
</head>
<body class="min-h-screen">
<div class="flex">
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <aside class="app-sidebar w-64 border-r flex flex-col min-h-screen" style="background:#f4f1ea;border-color:#e7e5e4">
    <div class="p-5">
      <a href="../dashboard/dashboard.html" class="brand-lockup no-underline"><span class="brand-mark">N</span><span class="brand-name"><span class="brand-word">NEDA</span><span class="brand-accent">Lab</span></span></a>
    </div>
    <nav id="sidebarNav" class="px-3 flex-1"></nav>
    <div class="p-5 border-t" style="border-color:#e7e5e4">
      <p id="sideUserName" class="text-sm font-medium text-stone-800">—</p>
      <p id="sideUserEmail" class="text-xs text-stone-500 truncate">—</p>
      <button id="logoutBtn" class="mt-3 text-xs font-medium text-red-700 hover:text-red-800">Sign out →</button>
    </div>
  </aside>

  <main class="app-main flex-1 p-8">
    <div class="max-w-6xl">
      <div class="flex items-center gap-3 mb-6">
        <button id="mobileMenuBtn" class="mobile-menu-btn">☰</button>
        <div>
          <h1 class="text-2xl font-bold text-stone-900">Version History</h1>
          <p class="text-sm text-stone-500">Snapshot, compare, and restore dataset versions.</p>
        </div>
      </div>

      <div class="card p-6 mb-6">
        <div class="grid grid-cols-3 gap-4">
          <div class="col-span-2">
            <label class="label">Dataset</label>
            <select id="datasetSelect" class="input"><option value="">Loading...</option></select>
          </div>
          <div class="flex items-end">
            <button id="snapshotBtn" class="btn-primary w-full" disabled>📸 Create Snapshot</button>
          </div>
        </div>
      </div>

      <div id="empty" class="card p-10 text-center">
        <p class="text-4xl mb-3">📚</p>
        <p class="font-medium text-stone-700">Select a dataset to view versions</p>
        <p class="text-sm text-stone-500 mt-1">Version history, comparison, and restore options will appear.</p>
      </div>

      <div id="loading" style="display:none" class="card p-8 text-center">
        <span class="spinner"></span>
        <p class="text-sm text-stone-600 mt-2">Loading...</p>
      </div>

      <div id="content" style="display:none"></div>
    </div>
  </main>
</div>

<script src="../shared/api.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/ui.js"></script>
<script src="versions.js"></script>
<script src="../shared/feature-registry.js"></script>
  <script src="../shared/dark-mode.js"></script>
<script src="../shared/notifications.js"></script>
<script src="../shared/upload-widget.js"></script>
</body>
</html>
