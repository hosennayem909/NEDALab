<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>NEDA LAB — Dataset Preview</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="../shared/dark-mode.css">
  <link rel="stylesheet" href="../shared/notifications.css">
  <link rel="stylesheet" href="../shared/upload-widget.css">
  <link rel="stylesheet" href="../shared/export-widget.css">
</head>
<body class="min-h-screen">
<div class="flex">
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <aside class="app-sidebar w-64 border-r flex flex-col min-h-screen" style="background:#f4f1ea;border-color:#e7e5e4">
    <div class="p-5">
      <a href="../dashboard/dashboard.html" class="brand-lockup no-underline"><span class="brand-mark">N</span><span class="brand-name"><span class="brand-word">NEDA</span><span class="brand-accent">Lab</span></span></a>
    </div>
    <nav id="sidebarNav" class="px-3 flex-1"></nav>
    <div class="p-5 border-t" style="border-color:#e7e5e4">
      <p id="sideUserName" class="text-sm font-medium text-stone-800">—</p>
      <p id="sideUserEmail" class="text-xs text-stone-500 truncate">—</p>
      <button id="logoutBtn" class="mt-3 text-xs font-medium text-red-700 hover:text-red-800">Sign out →</button>
    </div>
  </aside>

  <main class="app-main flex-1 p-8">
    <div class="page-shell">
      <div class="page-header" style="margin-bottom: 10px;">
        <div class="page-header-copy">
          <button id="mobileMenuBtn" class="mobile-menu-btn">☰</button>
          <div>
            <a href="../dashboard/dashboard.html" class="text-sm text-stone-500 hover:text-stone-800">← Dashboard</a>
          </div>
        </div>
      </div>

      <div class="page-header" style="margin-bottom: 24px;">
        <div>
          <h1 id="pageTitle">Dataset Preview</h1>
          <p id="pageSub" class="page-subtitle">Select a dataset from the Dataset Hub to preview it.</p>
        </div>
        <div class="page-header-actions">
          <button id="exportExcelBtn" class="btn-secondary">📊 Excel</button>
          <button id="exportPdfBtn" class="btn-secondary">📄 PDF</button>
          <button id="exportWordBtn" class="btn-secondary">📝 Word</button>
          <button id="downloadBtn" class="btn-primary">⬇ CSV</button>
        </div>
      </div>

      <!-- TABS -->
      <div class="flex gap-2 mb-4 border-b" style="border-color:#e7e5e4">
        <button data-tab="preview" class="tab-btn px-4 py-2 text-sm font-medium border-b-2 border-transparent" style="color:#78716c">Preview</button>
        <button data-tab="stats" class="tab-btn px-4 py-2 text-sm font-medium border-b-2 border-transparent" style="color:#78716c">Statistics</button>
        <button data-tab="report" class="tab-btn px-4 py-2 text-sm font-medium border-b-2 border-transparent" style="color:#78716c">Cleaning Report</button>
      </div>

      <!-- PREVIEW TAB -->
      <div id="tabPreview" class="card p-0 overflow-hidden">
        <div class="overflow-auto" style="max-height:70vh">
          <div id="previewContent" class="p-6"></div>
        </div>
      </div>

      <!-- STATS TAB -->
      <div id="tabStats" class="card p-6" style="display:none">
        <div id="statsContent"></div>
      </div>

      <!-- REPORT TAB -->
      <div id="tabReport" class="card p-6" style="display:none">
        <div id="reportContent"></div>
      </div>

    </div>
  </main>
</div>

<script src="../shared/api.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/ui.js"></script>
<script src="dataset.js"></script>
  <script src="../shared/feature-registry.js"></script>
  <script src="../shared/dark-mode.js"></script>
  <script src="../shared/notifications.js"></script>
  <script src="../shared/upload-widget.js"></script>
  <script src="../shared/export-widget.js"></script>
</body>
</html>
