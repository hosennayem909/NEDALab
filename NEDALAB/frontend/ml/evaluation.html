<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>NEDA LAB — ML Evaluation</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/dark-mode.css">
<link rel="stylesheet" href="../shared/notifications.css">
<link rel="stylesheet" href="../shared/upload-widget.css">
<style>
.eval-tab { padding:6px 14px; border-radius:6px; font-size:12px; font-weight:500;
  cursor:pointer; background:white; border:1px solid #e7e5e4; color:#57534e; }
.eval-tab.active { background:#047857; color:white; border-color:#047857; }
body.dark .eval-tab { background:#1c2028; border-color:#353a45; color:#d6d3d1; }
body.dark .eval-tab.active { background:#10b981; color:#062017; border-color:#10b981; }
.cv-fold-row { display:flex; gap:8px; padding:8px 12px; border-bottom:1px solid #f5f5f4; font-size:13px; }
.cv-fold-row:last-child { border-bottom:none; }
body.dark .cv-fold-row { border-color:#262932; }
</style>
</head>
<body class="min-h-screen">
<div class="flex">
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <aside class="app-sidebar w-64 border-r flex flex-col min-h-screen" style="background:#f4f1ea;border-color:#e7e5e4">
    <div class="p-5">
      <a href="../dashboard/dashboard.html" class="brand-lockup no-underline"><span class="brand-mark">N</span><span class="brand-name"><span class="brand-word">NEDA</span><span class="brand-accent">Lab</span></span></a>
    </div>
    <nav id="sidebarNav" class="px-3 flex-1"></nav>
    <div class="p-5 border-t" style="border-color:#e7e5e4">
      <p id="sideUserName" class="text-sm font-medium text-stone-800">—</p>
      <p id="sideUserEmail" class="text-xs text-stone-500 truncate">—</p>
      <button id="logoutBtn" class="mt-3 text-xs font-medium text-red-700 hover:text-red-800">Sign out →</button>
    </div>
  </aside>

  <main class="app-main flex-1 p-8">
    <div class="max-w-6xl">
      <div class="flex items-center gap-3 mb-6">
        <button id="mobileMenuBtn" class="mobile-menu-btn">☰</button>
        <div>
          <h1 class="text-2xl font-bold text-stone-900">ML Advanced Evaluation</h1>
          <p class="text-sm text-stone-500">Cross-validation, ROC, learning curves, and regression diagnostics.</p>
        </div>
      </div>

      <div class="card p-6 mb-6">
        <div class="grid grid-cols-4 gap-4">
          <div>
            <label class="label">Dataset</label>
            <select id="dsSelect" class="input"><option value="">Loading...</option></select>
          </div>
          <div>
            <label class="label">Task type</label>
            <select id="taskType" class="input">
              <option value="classification">Classification</option>
              <option value="regression">Regression</option>
            </select>
          </div>
          <div>
            <label class="label">Target</label>
            <select id="tgtSelect" class="input" disabled><option value="">—</option></select>
          </div>
          <div>
            <label class="label">Algorithm</label>
            <select id="algoSelect" class="input" disabled><option value="">—</option></select>
          </div>
        </div>
        <div class="mt-4">
          <label class="label">Features (X)</label>
          <div id="featList" class="border rounded-md p-2 max-h-32 overflow-y-auto flex flex-wrap gap-3" style="border-color:#e7e5e4">
            <p class="text-xs text-stone-500">Select dataset first</p>
          </div>
        </div>
      </div>

      <div class="flex gap-2 mb-6 flex-wrap">
        <button class="eval-tab active" data-eval="cv">📊 K-Fold CV</button>
        <button class="eval-tab" data-eval="roc">📈 ROC Curve</button>
        <button class="eval-tab" data-eval="pr">📉 Precision-Recall</button>
        <button class="eval-tab" data-eval="lc">📚 Learning Curve</button>
        <button class="eval-tab" data-eval="diag">🔬 Regression Diagnostics</button>
      </div>

      <div id="empty" class="card p-10 text-center">
        <p class="text-4xl mb-3">🎯</p>
        <p class="font-medium text-stone-700">Configure and select an evaluation</p>
        <p class="text-sm text-stone-500 mt-1">Results with interactive charts will appear here.</p>
      </div>

      <div id="loading" style="display:none" class="card p-8 text-center">
        <span class="spinner"></span>
        <p class="text-sm text-stone-600 mt-2">Running evaluation...</p>
      </div>

      <div id="result"></div>
    </div>
  </main>
</div>

<script src="../shared/api.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/ui.js"></script>
<script src="evaluation.js"></script>
<script src="../shared/feature-registry.js"></script>
  <script src="../shared/dark-mode.js"></script>
<script src="../shared/notifications.js"></script>
<script src="../shared/upload-widget.js"></script>
</body>
</html>
