<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>NEDA LAB — Unsupervised ML</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/dark-mode.css">
<link rel="stylesheet" href="../shared/notifications.css">
<link rel="stylesheet" href="../shared/upload-widget.css">
<style>
.unsup-tab { padding:6px 14px; border-radius:6px; font-size:12px; font-weight:500;
  cursor:pointer; background:white; border:1px solid #e7e5e4; color:#57534e; }
.unsup-tab.active { background:#047857; color:white; border-color:#047857; }
body.dark .unsup-tab { background:#1c2028; border-color:#353a45; color:#d6d3d1; }
body.dark .unsup-tab.active { background:#10b981; color:#062017; border-color:#10b981; }
.cluster-chip {
  display:inline-block; padding:4px 10px; border-radius:6px; font-size:12px;
  font-weight:500; font-family:'IBM Plex Mono', monospace; margin:3px;
}
</style>
</head>
<body class="min-h-screen">
<div class="flex">
  <div id="sidebarOverlay" class="sidebar-overlay"></div>
  <aside class="app-sidebar w-64 border-r flex flex-col min-h-screen" style="background:#f4f1ea;border-color:#e7e5e4">
    <div class="p-5">
      <a href="../dashboard/dashboard.html" class="brand-lockup no-underline"><span class="brand-mark">N</span><span class="brand-name"><span class="brand-word">NEDA</span><span class="brand-accent">Lab</span></span></a>
    </div>
    <nav id="sidebarNav" class="px-3 flex-1"></nav>
    <div class="p-5 border-t" style="border-color:#e7e5e4">
      <p id="sideUserName" class="text-sm font-medium text-stone-800">—</p>
      <p id="sideUserEmail" class="text-xs text-stone-500 truncate">—</p>
      <button id="logoutBtn" class="mt-3 text-xs font-medium text-red-700 hover:text-red-800">Sign out →</button>
    </div>
  </aside>

  <main class="app-main flex-1 p-8">
    <div class="max-w-6xl">
      <div class="flex items-center gap-3 mb-6">
        <button id="mobileMenuBtn" class="mobile-menu-btn">☰</button>
        <div>
          <h1 class="text-2xl font-bold text-stone-900">Unsupervised Machine Learning</h1>
          <p class="text-sm text-stone-500">Clustering, dimensionality reduction, and anomaly detection.</p>
        </div>
      </div>

      <div class="card p-6 mb-6">
        <div class="grid grid-cols-2 gap-4 mb-4">
          <div>
            <label class="label">Dataset</label>
            <select id="dsSelect" class="input"><option value="">Loading...</option></select>
          </div>
          <div>
            <label class="label">Select numeric features</label>
            <div id="featureList" class="border rounded-md p-2 max-h-32 overflow-y-auto flex flex-wrap gap-3" style="border-color:#e7e5e4">
              <p class="text-xs text-stone-500">Select dataset first</p>
            </div>
          </div>
        </div>
      </div>

      <div class="flex gap-2 mb-6 flex-wrap">
        <button class="unsup-tab active" data-method="kmeans">🔵 K-Means</button>
        <button class="unsup-tab" data-method="dbscan">🟢 DBSCAN</button>
        <button class="unsup-tab" data-method="pca">🎯 PCA</button>
        <button class="unsup-tab" data-method="anomaly">⚠️ Anomaly Detection</button>
      </div>

      <div id="configBox" class="card p-6 mb-6"></div>

      <div id="empty" class="card p-10 text-center">
        <p class="text-4xl mb-3">🧩</p>
        <p class="font-medium text-stone-700">Select features and a method</p>
        <p class="text-sm text-stone-500 mt-1">Results with interactive visualizations will appear here.</p>
      </div>

      <div id="loading" style="display:none" class="card p-8 text-center">
        <span class="spinner"></span>
        <p class="text-sm text-stone-600 mt-2">Computing...</p>
      </div>

      <div id="result"></div>
    </div>
  </main>
</div>

<script src="../shared/api.js"></script>
<script src="../shared/auth.js"></script>
<script src="../shared/ui.js"></script>
<script src="unsupervised.js"></script>
<script src="../shared/feature-registry.js"></script>
  <script src="../shared/dark-mode.js"></script>
<script src="../shared/notifications.js"></script>
<script src="../shared/upload-widget.js"></script>
</body>
</html>
